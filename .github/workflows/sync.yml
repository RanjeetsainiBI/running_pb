      # install time on every one of these runs - and sync.yml alone fans out
      # into a couple dozen job runs/day across all the matrix profiles.
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: npx esbuild scripts/sync.ts --bundle --platform=node --target=node22 --format=esm --packages=external --outfile=dist/sync.mjs
      - run: node dist/sync.mjs
        env:
          SYNC_JOB: ranktracker
          SYNC_VERBOSE_LOGS: ${{ secrets.SYNC_VERBOSE_LOGS }}
          SYNC_PROFILE_ID: ${{ matrix.profile }}
          SYNC_REASON: ${{ github.event.inputs.reason || github.event.client_payload.reason || 'cron' }}
          SYNC_MAX_MINUTES: "25"
          # Defensive: the "playwright" package (used only by the SERP tracker
          # stream) has a postinstall hook that downloads Chromium/Firefox/
          # WebKit unless this is set — these 6 ad/seller/finance streams
          # never touch a browser, so skip it to keep npm install fast.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          AMAZON_LWA_CLIENT_ID: ${{ secrets.AMAZON_LWA_CLIENT_ID }}
          AMAZON_LWA_CLIENT_SECRET: ${{ secrets.AMAZON_LWA_CLIENT_SECRET }}
          SP_LWA_CLIENT_ID: ${{ secrets.SP_LWA_CLIENT_ID }}
          SP_LWA_CLIENT_SECRET: ${{ secrets.SP_LWA_CLIENT_SECRET }}

  brandanalytics:
    # Only pulls new data once a week (the sync itself is idempotent per
    # ISO week — see runProfileBrandAnalyticsSync), so running it inside
    # `lightbundle` alongside daily streams is harmless: 6 of 7 days it's a
    # single cheap "already synced" lookup per profile and exits immediately.
    # No longer part of "all" directly (2026-09-24, see the SCALING comment
    # at the top of this file) — folded into `lightbundle` below. Kept here,
    # unchanged otherwise, purely for standalone `job=brandanalytics` runs.
    needs: sp-profiles
    if: ${{ needs.sp-profiles.outputs.profiles != '[]' && (github.event.inputs.job || github.event.client_payload.job || 'all') == 'brandanalytics' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJson(needs.sp-profiles.outputs.profiles) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: RanjeetsainiBI/bi-adlytics
          ref: main
          token: ${{ secrets.PRIVATE_REPO_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      # --omit=dev: none of these jobs run `next build`/lint/test (that's
      # Vercel's job + tests.yml) - they only bundle+run scripts/sync.ts via
      # esbuild, so the Next.js/Tailwind/ESLint/Jest/TypeScript devDependency
      # tree (the bulk of node_modules) is dead weight here. Combined with
      # the cache above, this is a meaningful chunk of the ~1min/job npm
      # install time on every one of these runs - and sync.yml alone fans out
      # into a couple dozen job runs/day across all the matrix profiles.
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: npx esbuild scripts/sync.ts --bundle --platform=node --target=node22 --format=esm --packages=external --outfile=dist/sync.mjs
      - run: node dist/sync.mjs
        env:
          SYNC_JOB: brandanalytics
          SYNC_VERBOSE_LOGS: ${{ secrets.SYNC_VERBOSE_LOGS }}
          SYNC_PROFILE_ID: ${{ matrix.profile }}
          SYNC_REASON: ${{ github.event.inputs.reason || github.event.client_payload.reason || 'cron' }}
          SYNC_MAX_MINUTES: "25"
          # Defensive: the "playwright" package (used only by the SERP tracker
          # stream) has a postinstall hook that downloads Chromium/Firefox/
          # WebKit unless this is set — these 6 ad/seller/finance streams
          # never touch a browser, so skip it to keep npm install fast.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          AMAZON_LWA_CLIENT_ID: ${{ secrets.AMAZON_LWA_CLIENT_ID }}
          AMAZON_LWA_CLIENT_SECRET: ${{ secrets.AMAZON_LWA_CLIENT_SECRET }}
          SP_LWA_CLIENT_ID: ${{ secrets.SP_LWA_CLIENT_ID }}
          SP_LWA_CLIENT_SECRET: ${{ secrets.SP_LWA_CLIENT_SECRET }}

  # Combined priceautomation + reviews + salestraffic + ranktracker +
  # brandanalytics — see the SCALING comment at the top of this file and
  # scripts/sync.ts's doLightBundle doc comment. One matrix job
  # (SYNC_JOB=lightbundle) runs all 5 sequentially per profile, instead
  # of 5 separate matrix jobs each paying their own npm-ci/esbuild overhead
  # and consuming their own share of the 20-concurrent-job budget.
  # storagefee is NOT in this bundle — it's on its own monthly-gated cadence
  # (see `storagefee-gate` above), not a daily one, so bundling it here
  # would have brought it back to running nightly.
  #
  # `needs: [seller, finances, ads]` + `if: always()` (see the `catalog`
  # job's matching comment above for the full reasoning) — waits for the
  # metrics-critical trio so they get first claim on available runner slots;
  # `always()` means a standalone `job=lightbundle` dispatch is never
  # blocked by streams that didn't run.
  #
  # SYNC_MAX_MINUTES is generous (45, vs. 25 for any one of these streams
  # alone) since this now runs 5 streams back-to-back for the same profile
  # instead of just 1 — has not been timed against a real large account yet,
  # watch the first few live runs and adjust if it's cutting streams off.
  lightbundle:
    needs: [sp-profiles, seller, finances, ads]
    if: >-
      always() &&
      needs.sp-profiles.outputs.profiles != '[]' &&
      ((github.event.inputs.job || github.event.client_payload.job || 'all') == 'all' || (github.event.inputs.job || github.event.client_payload.job || 'all') == 'lightbundle')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJson(needs.sp-profiles.outputs.profiles) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: RanjeetsainiBI/bi-adlytics
          ref: main
          token: ${{ secrets.PRIVATE_REPO_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: npx esbuild scripts/sync.ts --bundle --platform=node --target=node22 --format=esm --packages=external --outfile=dist/sync.mjs
      - run: node dist/sync.mjs
        env:
          SYNC_JOB: lightbundle
          SYNC_VERBOSE_LOGS: ${{ secrets.SYNC_VERBOSE_LOGS }}
          SYNC_PROFILE_ID: ${{ matrix.profile }}
          SYNC_REASON: ${{ github.event.inputs.reason || github.event.client_payload.reason || 'cron' }}
          SYNC_MAX_MINUTES: "45"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          AMAZON_LWA_CLIENT_ID: ${{ secrets.AMAZON_LWA_CLIENT_ID }}
          AMAZON_LWA_CLIENT_SECRET: ${{ secrets.AMAZON_LWA_CLIENT_SECRET }}
          SP_LWA_CLIENT_ID: ${{ secrets.SP_LWA_CLIENT_ID }}
          SP_LWA_CLIENT_SECRET: ${{ secrets.SP_LWA_CLIENT_SECRET }}

  # Monthly referral commissions (this repo's 1st-of-month cron only).
  referralcommissions:
    if: ${{ github.event.schedule == '0 3 1 * *' || (github.event.inputs.job || github.event.client_payload.job || '') == 'referralcommissions' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: RanjeetsainiBI/bi-adlytics
          ref: main
          token: ${{ secrets.PRIVATE_REPO_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: npx esbuild scripts/sync.ts --bundle --platform=node --target=node22 --format=esm --packages=external --outfile=dist/sync.mjs
      - run: node dist/sync.mjs
        env:
          SYNC_JOB: referralcommissions
          SYNC_REASON: ${{ github.event.inputs.reason || github.event.client_payload.reason || 'cron' }}
          SYNC_MAX_MINUTES: "10"
          # See inventory-ledger.yml's 2026-09-23 comment on this same line —
          # the SYNC_VERBOSE_LOGS secret was never actually forwarded to any
          # job in this file either, so setting it silently did nothing.
          SYNC_VERBOSE_LOGS: ${{ secrets.SYNC_VERBOSE_LOGS }}
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
