  ads-profiles-compute:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: RanjeetsainiBI/bi-adlytics
          ref: main
          token: ${{ secrets.PRIVATE_REPO_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
