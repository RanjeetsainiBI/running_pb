name: Sync Amazon data (public-repo runner)

# ============================================================================
# THIS FILE DOES NOT GO IN THE bi-adlytics REPO. It belongs in a brand-new,
# SEPARATE public repo you create (any name — e.g. "bi-adlytics-ci"), at
# path .github/workflows/sync.yml in THAT repo.
#
# WHY THIS EXISTS: bi-adlytics (the private repo with your actual app code)
# was burning through its monthly GitHub Actions minutes allotment — this
# workflow alone fanned out into ~18 job runs every night. Public repos get
# UNLIMITED free GitHub-hosted Actions minutes, so this is the exact same
# workflow, just living in a public repo and checking out the PRIVATE repo's
# code at runtime instead of its own. No application source code, and no
# business data, lives in the public repo itself — see the checkout step
# below and scripts/sync.ts's redacted-by-default logging
# leave the private repo. What IS visible to anyone who opens the public
# repo: this YAML file itself (job names, schedule, env var NAMES — never
# values) and this repo's own Actions run logs (which only ever print
# redacted ok/error lines by default, see scripts/sync.ts).
#
# bi-adlytics's OWN copy of this workflow (.github/workflows/sync.yml) is
# left intact but DORMANT (its `schedule:` trigger is commented out) —
# switching back to running it there is a one-line uncomment, no rebuild
# needed. See that file's top comment for the switch-back instructions.
#
# ---------------------------------------------------------------------------
# ONE-TIME SETUP before this can run:
#
# 1. Create this repo on github.com/new — Public, empty (no README needed,
#    though a short one describing it as "CI runner for a private project"
#    is good practice). Upload this file to .github/workflows/sync.yml here.
#
# 2. Create a fine-grained Personal Access Token scoped to ONLY the
#    bi-adlytics repo, Repository permissions -> Contents: Read-only.
#    (github.com -> Settings -> Developer settings -> Personal access tokens
#    -> Fine-grained tokens -> Generate new token -> Repository access:
#    "Only select repositories" -> bi-adlytics -> Contents: Read-only.)
#    Set an expiration and put a reminder to renew it before it lapses —
#    when it expires, every run here starts failing at the checkout step.
#
# 3. In THIS public repo's own Settings -> Secrets and variables -> Actions,
#    add:
#      PRIVATE_REPO_PAT              <- the token from step 2
#      NEXT_PUBLIC_SUPABASE_URL      <- same value as in bi-adlytics
#      SUPABASE_SERVICE_ROLE_KEY     <- same value as in bi-adlytics
#      TOKEN_ENCRYPTION_KEY          <- same value as in bi-adlytics
#      AMAZON_LWA_CLIENT_ID          <- same value as in bi-adlytics
#      AMAZON_LWA_CLIENT_SECRET      <- same value as in bi-adlytics
#      SP_LWA_CLIENT_ID              <- same value as in bi-adlytics
#      SP_LWA_CLIENT_SECRET          <- same value as in bi-adlytics
#    (These are the exact same secret NAMES bi-adlytics already has — just
#    re-enter the same values here. GitHub secrets never sync across repos,
#    each repo keeps its own copy, and each is encrypted/masked the same way
#    regardless of the repo's visibility.)
#
# 4. Also generate a package-lock.json situation the same way bi-adlytics
#    did if `npm ci` complains — unlikely since this checks out bi-adlytics'
#    own lockfile via the checkout step below, just flagging it as the one
#    thing that could differ from a fresh repo.
# ============================================================================

on:
  schedule:
    # 08:00 IST daily = 02:30 UTC (IST is UTC+5:30) — this is now the LIVE
    # schedule; bi-adlytics's own copy has this commented out.
    - cron: "30 2 * * *"
    # 14:00 IST (2:00 PM) = 08:30 UTC — added 2026-09-19, second run of "all"
    # each day alongside the 08:00 IST run above.
    - cron: "30 8 * * *"
    # 08:30 IST (8:30 AM) = 03:00 UTC, 1st of every month — drives ONLY the
    # referralcommissions job below (matched via github.event.schedule, not
    # "all"), since commissions are a once-a-month calculation, not a daily
    # sync. Added 2026-09-19.
    - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      job:
        description: "all | ads | searchterm | seller | finances | reviews | salestraffic | ranktracker | brandanalytics | catalog | returnsbackfill | fbareturnsbackfill | referralcommissions (inventoryledger runs from its own inventory-ledger.yml, not from here)"
        required: false
        default: "all"
      amazonProfileId:
        description: "Restrict to one profile id (optional)"
        required: false
        default: ""
      reason:
        description: "manual | cron | initial"
        required: false
        default: "manual"
      backfillStart:
        description: "returnsbackfill/fbareturnsbackfill only — start date YYYY-MM-DD (inclusive)"
        required: false
        default: ""
      backfillEnd:
        description: "returnsbackfill/fbareturnsbackfill only — end date YYYY-MM-DD (exclusive)"
        required: false
        default: ""
  repository_dispatch:
    types: [sync]

concurrency:
  group: amazon-sync-${{ github.run_id }}
  cancel-in-progress: false

# Every job below is IDENTICAL to bi-adlytics's own sync.yml, with exactly
# one addition to the checkout step: `with: repository / ref / token`,
# pulling bi-adlytics's code into THIS runner instead of this (empty)
# public repo's own contents. Nothing else differs — same matrix fan-out,
# same env vars, same scripts. Keep the two files in sync by hand if you
# ever edit job logic in bi-adlytics/.github/workflows/sync.yml.
jobs:
  seller:
    needs: sp-profiles
    if: ${{ needs.sp-profiles.outputs.profiles != '[]' && ((github.event.inputs.job || github.event.client_payload.job || 'all') == 'all' || (github.event.inputs.job || github.event.client_payload.job || 'all') == 'seller') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJson(needs.sp-profiles.outputs.profiles) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: RanjeetsainiBI/bi-adlytics
          ref: main
          token: ${{ secrets.PRIVATE_REPO_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: npx esbuild scripts/sync.ts --bundle --platform=node --target=node22 --format=esm --packages=external --outfile=dist/sync.mjs
      - run: node dist/sync.mjs
        env:
          SYNC_JOB: seller
          SYNC_PROFILE_ID: ${{ matrix.profile }}
          SYNC_REASON: ${{ github.event.inputs.reason || github.event.client_payload.reason || 'cron' }}
          SYNC_MAX_MINUTES: "25"
          # See inventory-ledger.yml's 2026-09-23 comment on this same line —
          # the SYNC_VERBOSE_LOGS secret was never actually forwarded to any
          # job in this file either, so setting it silently did nothing.
          SYNC_VERBOSE_LOGS: ${{ secrets.SYNC_VERBOSE_LOGS }}
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          AMAZON_LWA_CLIENT_ID: ${{ secrets.AMAZON_LWA_CLIENT_ID }}
          AMAZON_LWA_CLIENT_SECRET: ${{ secrets.AMAZON_LWA_CLIENT_SECRET }}
          SP_LWA_CLIENT_ID: ${{ secrets.SP_LWA_CLIENT_ID }}
          SP_LWA_CLIENT_SECRET: ${{ secrets.SP_LWA_CLIENT_SECRET }}

  priceautomation:
    needs: sp-profiles
    if: ${{ needs.sp-profiles.outputs.profiles != '[]' && ((github.event.inputs.job || github.event.client_payload.job || 'all') == 'all' || (github.event.inputs.job || github.event.client_payload.job || 'all') == 'priceautomation') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJson(needs.sp-profiles.outputs.profiles) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: RanjeetsainiBI/bi-adlytics
          ref: main
          token: ${{ secrets.PRIVATE_REPO_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: npx esbuild scripts/sync.ts --bundle --platform=node --target=node22 --format=esm --packages=external --outfile=dist/sync.mjs
      - run: node dist/sync.mjs
        env:
          SYNC_JOB: priceautomation
          SYNC_PROFILE_ID: ${{ matrix.profile }}
          SYNC_REASON: ${{ github.event.inputs.reason || github.event.client_payload.reason || 'cron' }}
          SYNC_MAX_MINUTES: "10"
          # See inventory-ledger.yml's 2026-09-23 comment on this same line —
          # the SYNC_VERBOSE_LOGS secret was never actually forwarded to any
          # job in this file either, so setting it silently did nothing.
          SYNC_VERBOSE_LOGS: ${{ secrets.SYNC_VERBOSE_LOGS }}
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          AMAZON_LWA_CLIENT_ID: ${{ secrets.AMAZON_LWA_CLIENT_ID }}
          AMAZON_LWA_CLIENT_SECRET: ${{ secrets.AMAZON_LWA_CLIENT_SECRET }}
          SP_LWA_CLIENT_ID: ${{ secrets.SP_LWA_CLIENT_ID }}
          SP_LWA_CLIENT_SECRET: ${{ secrets.SP_LWA_CLIENT_SECRET }}

  # Refreshes catalog_items (title, images, bullets, and — critically — the
  # current Amazon Brand) per ASIN via the SP-API Catalog Items endpoint.
  # This is the SOLE source of Brand shown in Product Performance / Brand
  # Performance (see buildBrandLookup in
  # lib/analytics/performance-benchmark-query.ts, 2026-09-04 — the Category
  # CSV's Brand column stopped being read that day). Added 2026-09-18: this
  # job never existed before, so catalog_items was always empty for every
  # account and every SKU rolled up into "Unbranded" from day one — not a
  # bug in the lookup logic, just a job that was written (runProfileCatalogSync
  # in lib/sync/core.ts) but never wired into the schedule until now.
  catalog:
    needs: sp-profiles
    if: ${{ needs.sp-profiles.outputs.profiles != '[]' && ((github.event.inputs.job || github.event.client_payload.job || 'all') == 'all' || (github.event.inputs.job || github.event.client_payload.job || 'all') == 'catalog') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJson(needs.sp-profiles.outputs.profiles) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: RanjeetsainiBI/bi-adlytics
          ref: main
          token: ${{ secrets.PRIVATE_REPO_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: npx esbuild scripts/sync.ts --bundle --platform=node --target=node22 --format=esm --packages=external --outfile=dist/sync.mjs
      - run: node dist/sync.mjs
        env:
          SYNC_JOB: catalog
          SYNC_PROFILE_ID: ${{ matrix.profile }}
          SYNC_REASON: ${{ github.event.inputs.reason || github.event.client_payload.reason || 'cron' }}
          SYNC_MAX_MINUTES: "30"
          # See inventory-ledger.yml's 2026-09-23 comment on this same line —
          # the SYNC_VERBOSE_LOGS secret was never actually forwarded to any
          # job in this file either, so setting it silently did nothing.
          SYNC_VERBOSE_LOGS: ${{ secrets.SYNC_VERBOSE_LOGS }}
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          AMAZON_LWA_CLIENT_ID: ${{ secrets.AMAZON_LWA_CLIENT_ID }}
          AMAZON_LWA_CLIENT_SECRET: ${{ secrets.AMAZON_LWA_CLIENT_SECRET }}
          SP_LWA_CLIENT_ID: ${{ secrets.SP_LWA_CLIENT_ID }}
          SP_LWA_CLIENT_SECRET: ${{ secrets.SP_LWA_CLIENT_SECRET }}

  returnsbackfill:
    if: ${{ (github.event.inputs.job || github.event.client_payload.job || '') == 'returnsbackfill' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: RanjeetsainiBI/bi-adlytics
          ref: main
          token: ${{ secrets.PRIVATE_REPO_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: npx esbuild scripts/sync.ts --bundle --platform=node --target=node22 --format=esm --packages=external --outfile=dist/sync.mjs
      - run: node dist/sync.mjs
        env:
          SYNC_JOB: returnsbackfill
          SYNC_PROFILE_ID: ${{ github.event.inputs.amazonProfileId || github.event.client_payload.amazonProfileId || '' }}
          SYNC_BACKFILL_START: ${{ github.event.inputs.backfillStart || github.event.client_payload.backfillStart || '' }}
          SYNC_BACKFILL_END: ${{ github.event.inputs.backfillEnd || github.event.client_payload.backfillEnd || '' }}
          SYNC_REASON: ${{ github.event.inputs.reason || github.event.client_payload.reason || 'manual' }}
          SYNC_MAX_MINUTES: "25"
          # See inventory-ledger.yml's 2026-09-23 comment on this same line —
          # the SYNC_VERBOSE_LOGS secret was never actually forwarded to any
          # job in this file either, so setting it silently did nothing.
          SYNC_VERBOSE_LOGS: ${{ secrets.SYNC_VERBOSE_LOGS }}
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          AMAZON_LWA_CLIENT_ID: ${{ secrets.AMAZON_LWA_CLIENT_ID }}
          AMAZON_LWA_CLIENT_SECRET: ${{ secrets.AMAZON_LWA_CLIENT_SECRET }}
          SP_LWA_CLIENT_ID: ${{ secrets.SP_LWA_CLIENT_ID }}
          SP_LWA_CLIENT_SECRET: ${{ secrets.SP_LWA_CLIENT_SECRET }}

  fbareturnsbackfill:
    if: ${{ (github.event.inputs.job || github.event.client_payload.job || '') == 'fbareturnsbackfill' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: RanjeetsainiBI/bi-adlytics
          ref: main
          token: ${{ secrets.PRIVATE_REPO_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: npx esbuild scripts/sync.ts --bundle --platform=node --target=node22 --format=esm --packages=external --outfile=dist/sync.mjs
      - run: node dist/sync.mjs
        env:
          SYNC_JOB: fbareturnsbackfill
          SYNC_PROFILE_ID: ${{ github.event.inputs.amazonProfileId || github.event.client_payload.amazonProfileId || '' }}
          SYNC_BACKFILL_START: ${{ github.event.inputs.backfillStart || github.event.client_payload.backfillStart || '' }}
          SYNC_BACKFILL_END: ${{ github.event.inputs.backfillEnd || github.event.client_payload.backfillEnd || '' }}
          SYNC_REASON: ${{ github.event.inputs.reason || github.event.client_payload.reason || 'manual' }}
          SYNC_MAX_MINUTES: "25"
          # See inventory-ledger.yml's 2026-09-23 comment on this same line —
          # the SYNC_VERBOSE_LOGS secret was never actually forwarded to any
          # job in this file either, so setting it silently did nothing.
          SYNC_VERBOSE_LOGS: ${{ secrets.SYNC_VERBOSE_LOGS }}
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          AMAZON_LWA_CLIENT_ID: ${{ secrets.AMAZON_LWA_CLIENT_ID }}
          AMAZON_LWA_CLIENT_SECRET: ${{ secrets.AMAZON_LWA_CLIENT_SECRET }}
          SP_LWA_CLIENT_ID: ${{ secrets.SP_LWA_CLIENT_ID }}
          SP_LWA_CLIENT_SECRET: ${{ secrets.SP_LWA_CLIENT_SECRET }}

  ads-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      profiles: ${{ steps.list.outputs.profiles }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: RanjeetsainiBI/bi-adlytics
          ref: main
          token: ${{ secrets.PRIVATE_REPO_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: npx esbuild scripts/list-ads-profiles.ts --bundle --platform=node --target=node22 --format=esm --packages=external --outfile=dist/list-ads-profiles.mjs
      - id: list
        run: node dist/list-ads-profiles.mjs
        env:
          SYNC_PROFILE_ID: ${{ github.event.inputs.amazonProfileId || github.event.client_payload.amazonProfileId || '' }}
          # See inventory-ledger.yml's 2026-09-23 comment on this same line —
          # the SYNC_VERBOSE_LOGS secret was never actually forwarded to any
          # job in this file either, so setting it silently did nothing.
          SYNC_VERBOSE_LOGS: ${{ secrets.SYNC_VERBOSE_LOGS }}
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  sp-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      profiles: ${{ steps.list.outputs.profiles }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: RanjeetsainiBI/bi-adlytics
          ref: main
          token: ${{ secrets.PRIVATE_REPO_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: npx esbuild scripts/list-sp-profiles.ts --bundle --platform=node --target=node22 --format=esm --packages=external --outfile=dist/list-sp-profiles.mjs
      - id: list
        run: node dist/list-sp-profiles.mjs
        env:
          SYNC_PROFILE_ID: ${{ github.event.inputs.amazonProfileId || github.event.client_payload.amazonProfileId || '' }}
          # See inventory-ledger.yml's 2026-09-23 comment on this same line —
          # the SYNC_VERBOSE_LOGS secret was never actually forwarded to any
          # job in this file either, so setting it silently did nothing.
          SYNC_VERBOSE_LOGS: ${{ secrets.SYNC_VERBOSE_LOGS }}
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  ads:
    needs: ads-profiles
    if: ${{ needs.ads-profiles.outputs.profiles != '[]' && ((github.event.inputs.job || github.event.client_payload.job || 'all') == 'all' || (github.event.inputs.job || github.event.client_payload.job || 'all') == 'ads') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJson(needs.ads-profiles.outputs.profiles) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: RanjeetsainiBI/bi-adlytics
          ref: main
          token: ${{ secrets.PRIVATE_REPO_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: npx esbuild scripts/sync.ts --bundle --platform=node --target=node22 --format=esm --packages=external --outfile=dist/sync.mjs
      - run: node dist/sync.mjs
        env:
          SYNC_JOB: ads
          SYNC_PROFILE_ID: ${{ matrix.profile }}
          SYNC_REASON: ${{ github.event.inputs.reason || github.event.client_payload.reason || 'cron' }}
          SYNC_MAX_MINUTES: "25"
          # See inventory-ledger.yml's 2026-09-23 comment on this same line —
          # the SYNC_VERBOSE_LOGS secret was never actually forwarded to any
          # job in this file either, so setting it silently did nothing.
          SYNC_VERBOSE_LOGS: ${{ secrets.SYNC_VERBOSE_LOGS }}
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          AMAZON_LWA_CLIENT_ID: ${{ secrets.AMAZON_LWA_CLIENT_ID }}
          AMAZON_LWA_CLIENT_SECRET: ${{ secrets.AMAZON_LWA_CLIENT_SECRET }}
          SP_LWA_CLIENT_ID: ${{ secrets.SP_LWA_CLIENT_ID }}
          SP_LWA_CLIENT_SECRET: ${{ secrets.SP_LWA_CLIENT_SECRET }}

  searchterm:
    needs: ads-profiles
    if: ${{ needs.ads-profiles.outputs.profiles != '[]' && (github.event.inputs.job || github.event.client_payload.job || '') == 'searchterm' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJson(needs.ads-profiles.outputs.profiles) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: RanjeetsainiBI/bi-adlytics
          ref: main
          token: ${{ secrets.PRIVATE_REPO_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: npx esbuild scripts/sync.ts --bundle --platform=node --target=node22 --format=esm --packages=external --outfile=dist/sync.mjs
      - run: node dist/sync.mjs
        env:
          SYNC_JOB: searchterm
          SYNC_PROFILE_ID: ${{ matrix.profile }}
          SYNC_REASON: ${{ github.event.inputs.reason || github.event.client_payload.reason || 'manual' }}
          SYNC_MAX_MINUTES: "25"
          # See inventory-ledger.yml's 2026-09-23 comment on this same line —
          # the SYNC_VERBOSE_LOGS secret was never actually forwarded to any
          # job in this file either, so setting it silently did nothing.
          SYNC_VERBOSE_LOGS: ${{ secrets.SYNC_VERBOSE_LOGS }}
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          AMAZON_LWA_CLIENT_ID: ${{ secrets.AMAZON_LWA_CLIENT_ID }}
          AMAZON_LWA_CLIENT_SECRET: ${{ secrets.AMAZON_LWA_CLIENT_SECRET }}
          SP_LWA_CLIENT_ID: ${{ secrets.SP_LWA_CLIENT_ID }}
          SP_LWA_CLIENT_SECRET: ${{ secrets.SP_LWA_CLIENT_SECRET }}

  finances:
    needs: sp-profiles
    if: ${{ needs.sp-profiles.outputs.profiles != '[]' && ((github.event.inputs.job || github.event.client_payload.job || 'all') == 'all' || (github.event.inputs.job || github.event.client_payload.job || 'all') == 'finances') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJson(needs.sp-profiles.outputs.profiles) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: RanjeetsainiBI/bi-adlytics
          ref: main
          token: ${{ secrets.PRIVATE_REPO_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: npx esbuild scripts/sync.ts --bundle --platform=node --target=node22 --format=esm --packages=external --outfile=dist/sync.mjs
