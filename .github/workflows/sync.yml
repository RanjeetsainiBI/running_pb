name: Sync Amazon data

# Each stream runs on its OWN worker (parallel jobs) so it gets a full time
# budget and we never repeat API calls across streams. Pick a single stream
# with the `job` input (all | ads | searchterm | seller | finances | ... |
# returnsbackfill) when testing. `returnsbackfill` is a one-off historical
# catch-up for seller_returns — it is NOT part of "all" (see the `if:` on
# that job below) and requires the backfillStart/backfillEnd inputs.
# `searchterm` is likewise NOT part of "all" — the regular `ads` job already
# pulls search term data as one of its 10 reports every night; `searchterm`
# exists only so you can refresh JUST that one report on demand (e.g. right
# after standing up the Search Term tab) without waiting on the other 9.
#
# DORMANT AS OF 2026-09-17 — schedule trigger disabled on purpose (see
# `schedule:` below, commented out). The live nightly sync moved to a
# SEPARATE PUBLIC repo's copy of this same workflow, which checks out this
# private repo's code at runtime via a fine-grained, read-only PAT and runs
# identically — public repos get unlimited free GitHub-hosted Actions
# minutes, which is what this repo's `ubuntu-latest` runners were burning
# through every night (see the minutes-usage conversation this change came
# from). This file is kept fully intact and unchanged otherwise specifically
# so switching back is a ONE-LINE change: uncomment the `- cron: "30 2 * * *"`
# line below (and disable/delete the public repo's copy, or just leave both
# — see the caveat about that in the chat, not repeated here) to make this
# the live version again. `workflow_dispatch` still works right now if you
# ever want to run this repo's copy manually without re-enabling the cron.
on:
  # schedule:              <- DISABLED: uncomment this key AND the cron line
  #   # 08:00 IST daily = 02:30 UTC (IST is UTC+5:30)
  #   - cron: "30 2 * * *"  to make this repo's copy live again. Left as a
  #                         block comment rather than an empty `schedule:`
  #                         key because `schedule:` with no list under it is
  #                         invalid YAML and would break every trigger below.
  workflow_dispatch:
    inputs:
      job:
        description: "all | ads | searchterm | seller | finances | reviews | salestraffic | ranktracker | brandanalytics | returnsbackfill | fbareturnsbackfill"
        required: false
        default: "all"
      amazonProfileId:
        description: "Restrict to one profile id (optional)"
        required: false
        default: ""
      reason:
        description: "manual | cron | initial"
        required: false
        default: "manual"
      backfillStart:
        description: "returnsbackfill/fbareturnsbackfill only — start date YYYY-MM-DD (inclusive)"
        required: false
        default: ""
      backfillEnd:
        description: "returnsbackfill/fbareturnsbackfill only — end date YYYY-MM-DD (exclusive)"
        required: false
        default: ""
  repository_dispatch:
    types: [sync]

# Each run gets its own concurrency group so manual syncs never queue behind
# a scheduled run. Scheduled runs still cancel any already-queued scheduled run
# (cancel-in-progress: true) to avoid pileups, but manual dispatches are
# completely independent.
concurrency:
  group: amazon-sync-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  seller:
    needs: sp-profiles
    if: ${{ needs.sp-profiles.outputs.profiles != '[]' && ((github.event.inputs.job || github.event.client_payload.job || 'all') == 'all' || (github.event.inputs.job || github.event.client_payload.job || 'all') == 'seller') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJson(needs.sp-profiles.outputs.profiles) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      # --omit=dev: none of these jobs run `next build`/lint/test (that's
      # Vercel's job + tests.yml) - they only bundle+run scripts/sync.ts via
      # esbuild, so the Next.js/Tailwind/ESLint/Jest/TypeScript devDependency
      # tree (the bulk of node_modules) is dead weight here. Combined with
      # the cache above, this is a meaningful chunk of the ~1min/job npm
      # install time on every one of these runs - and sync.yml alone fans out
      # into a couple dozen job runs/day across all the matrix profiles.
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: npx esbuild scripts/sync.ts --bundle --platform=node --target=node22 --format=esm --packages=external --outfile=dist/sync.mjs
      - run: node dist/sync.mjs
        env:
          SYNC_JOB: seller
          SYNC_PROFILE_ID: ${{ matrix.profile }}
          SYNC_REASON: ${{ github.event.inputs.reason || github.event.client_payload.reason || 'cron' }}
          SYNC_MAX_MINUTES: "25"
          # Defensive: the "playwright" package (used only by the SERP tracker
          # stream) has a postinstall hook that downloads Chromium/Firefox/
          # WebKit unless this is set — these 6 ad/seller/finance streams
          # never touch a browser, so skip it to keep npm install fast.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          AMAZON_LWA_CLIENT_ID: ${{ secrets.AMAZON_LWA_CLIENT_ID }}
          AMAZON_LWA_CLIENT_SECRET: ${{ secrets.AMAZON_LWA_CLIENT_SECRET }}
          SP_LWA_CLIENT_ID: ${{ secrets.SP_LWA_CLIENT_ID }}
          SP_LWA_CLIENT_SECRET: ${{ secrets.SP_LWA_CLIENT_SECRET }}

  # Evaluates enabled price_automation_rules against current inventory and
  # stages price_automation_suggestions rows (never pushes to Amazon itself
  # — see runPriceAutomationEvaluate in lib/sync/core.ts). Safe to run on
  # the once-daily cron alongside everything else since it's read-only
  # w.r.t. the live listing; a human approves each suggestion in the Price
  # Testing tab, which is what actually calls SP-API.
  priceautomation:
    needs: sp-profiles
    if: ${{ needs.sp-profiles.outputs.profiles != '[]' && ((github.event.inputs.job || github.event.client_payload.job || 'all') == 'all' || (github.event.inputs.job || github.event.client_payload.job || 'all') == 'priceautomation') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJson(needs.sp-profiles.outputs.profiles) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      # --omit=dev: none of these jobs run `next build`/lint/test (that's
      # Vercel's job + tests.yml) - they only bundle+run scripts/sync.ts via
      # esbuild, so the Next.js/Tailwind/ESLint/Jest/TypeScript devDependency
      # tree (the bulk of node_modules) is dead weight here. Combined with
      # the cache above, this is a meaningful chunk of the ~1min/job npm
      # install time on every one of these runs - and sync.yml alone fans out
      # into a couple dozen job runs/day across all the matrix profiles.
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: npx esbuild scripts/sync.ts --bundle --platform=node --target=node22 --format=esm --packages=external --outfile=dist/sync.mjs
      - run: node dist/sync.mjs
        env:
          SYNC_JOB: priceautomation
          SYNC_PROFILE_ID: ${{ matrix.profile }}
          SYNC_REASON: ${{ github.event.inputs.reason || github.event.client_payload.reason || 'cron' }}
          SYNC_MAX_MINUTES: "10"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          AMAZON_LWA_CLIENT_ID: ${{ secrets.AMAZON_LWA_CLIENT_ID }}
          AMAZON_LWA_CLIENT_SECRET: ${{ secrets.AMAZON_LWA_CLIENT_SECRET }}
          SP_LWA_CLIENT_ID: ${{ secrets.SP_LWA_CLIENT_ID }}
          SP_LWA_CLIENT_SECRET: ${{ secrets.SP_LWA_CLIENT_SECRET }}

  # One-off historical catch-up for seller_returns (see runReturnsBackfill in
  # lib/sync/core.ts). Deliberately excluded from "all" — only runs when the
  # `job` input is exactly "returnsbackfill", so the daily cron never touches
  # it. Requires backfillStart/backfillEnd inputs.
  returnsbackfill:
    if: ${{ (github.event.inputs.job || github.event.client_payload.job || '') == 'returnsbackfill' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      # --omit=dev: none of these jobs run `next build`/lint/test (that's
      # Vercel's job + tests.yml) - they only bundle+run scripts/sync.ts via
      # esbuild, so the Next.js/Tailwind/ESLint/Jest/TypeScript devDependency
      # tree (the bulk of node_modules) is dead weight here. Combined with
      # the cache above, this is a meaningful chunk of the ~1min/job npm
      # install time on every one of these runs - and sync.yml alone fans out
      # into a couple dozen job runs/day across all the matrix profiles.
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: npx esbuild scripts/sync.ts --bundle --platform=node --target=node22 --format=esm --packages=external --outfile=dist/sync.mjs
      - run: node dist/sync.mjs
        env:
          SYNC_JOB: returnsbackfill
          SYNC_PROFILE_ID: ${{ github.event.inputs.amazonProfileId || github.event.client_payload.amazonProfileId || '' }}
          SYNC_BACKFILL_START: ${{ github.event.inputs.backfillStart || github.event.client_payload.backfillStart || '' }}
          SYNC_BACKFILL_END: ${{ github.event.inputs.backfillEnd || github.event.client_payload.backfillEnd || '' }}
          SYNC_REASON: ${{ github.event.inputs.reason || github.event.client_payload.reason || 'manual' }}
          SYNC_MAX_MINUTES: "25"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          AMAZON_LWA_CLIENT_ID: ${{ secrets.AMAZON_LWA_CLIENT_ID }}
          AMAZON_LWA_CLIENT_SECRET: ${{ secrets.AMAZON_LWA_CLIENT_SECRET }}
          SP_LWA_CLIENT_ID: ${{ secrets.SP_LWA_CLIENT_ID }}
          SP_LWA_CLIENT_SECRET: ${{ secrets.SP_LWA_CLIENT_SECRET }}

  # One-off historical catch-up for the FBA-only returns report (see
  # runFbaReturnsBackfill in lib/sync/core.ts). Added 2026-09-10: the
  # 2026-07-17 switch to the "holistic" Returns Report turned out to miss
  # real FBA return events that never generate a formal return-request/RMA
  # record (confirmed against a live seller's Seller Central "FBA customer
  # returns" report) — so the FBA-only report needed to come back as a
  # SECOND source, not a replacement. This job closes the historical gap
  # left by that report being un-synced since the cutover; the daily
  # `seller` job's fbaReturnsStep keeps it current from here on. Run this
  # once (job=fbareturnsbackfill) after this workflow deploys. Deliberately
  # excluded from "all", same reasoning as `returnsbackfill` above.
  fbareturnsbackfill:
    if: ${{ (github.event.inputs.job || github.event.client_payload.job || '') == 'fbareturnsbackfill' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: npx esbuild scripts/sync.ts --bundle --platform=node --target=node22 --format=esm --packages=external --outfile=dist/sync.mjs
      - run: node dist/sync.mjs
        env:
          SYNC_JOB: fbareturnsbackfill
          SYNC_PROFILE_ID: ${{ github.event.inputs.amazonProfileId || github.event.client_payload.amazonProfileId || '' }}
          SYNC_BACKFILL_START: ${{ github.event.inputs.backfillStart || github.event.client_payload.backfillStart || '' }}
          SYNC_BACKFILL_END: ${{ github.event.inputs.backfillEnd || github.event.client_payload.backfillEnd || '' }}
          SYNC_REASON: ${{ github.event.inputs.reason || github.event.client_payload.reason || 'manual' }}
          SYNC_MAX_MINUTES: "25"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          AMAZON_LWA_CLIENT_ID: ${{ secrets.AMAZON_LWA_CLIENT_ID }}
          AMAZON_LWA_CLIENT_SECRET: ${{ secrets.AMAZON_LWA_CLIENT_SECRET }}
          SP_LWA_CLIENT_ID: ${{ secrets.SP_LWA_CLIENT_ID }}
          SP_LWA_CLIENT_SECRET: ${{ secrets.SP_LWA_CLIENT_SECRET }}

  # Lists active amazon_profiles ids so the `ads` job below can fan out into
  # one runner PER PROFILE instead of looping through all profiles inside a
  # single runner's shared 25-minute budget. Root-caused 2026-07-13: with 2+
  # profiles sharing one deadline, the profile processed first (helped along
  # by Amazon rate-limiting) could eat most of the 25 minutes, leaving the
  # next profile too little time for even one of its 8 ad reports to finish
  # generating — so that profile's spend/impressions silently went stale.
  # Always runs (regardless of the `job` input) so `fromJson()` below never
  # sees an empty/skipped output.
  ads-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      profiles: ${{ steps.list.outputs.profiles }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      # --omit=dev: none of these jobs run `next build`/lint/test (that's
      # Vercel's job + tests.yml) - they only bundle+run scripts/sync.ts via
      # esbuild, so the Next.js/Tailwind/ESLint/Jest/TypeScript devDependency
      # tree (the bulk of node_modules) is dead weight here. Combined with
      # the cache above, this is a meaningful chunk of the ~1min/job npm
      # install time on every one of these runs - and sync.yml alone fans out
      # into a couple dozen job runs/day across all the matrix profiles.
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: npx esbuild scripts/list-ads-profiles.ts --bundle --platform=node --target=node22 --format=esm --packages=external --outfile=dist/list-ads-profiles.mjs
      - id: list
        run: node dist/list-ads-profiles.mjs
        env:
          SYNC_PROFILE_ID: ${{ github.event.inputs.amazonProfileId || github.event.client_payload.amazonProfileId || '' }}
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  # Same fan-out fix as ads-profiles above, extended to the 6 SP-API-only
  # streams (seller/finances/reviews/salestraffic/ranktracker/brandanalytics).
  # Those jobs still looped over every SP-connected profile inside ONE
  # runner's shared 25-minute budget (scripts/sync.ts's `for (const id of
  # spProfiles)` loop) — the exact same starvation bug that was root-caused
  # and fixed for `ads` on 2026-07-13, just never extended past that one job.
  # At more than a couple of profiles sharing one deadline, whichever
  # profiles sort last in the query never get a turn once total per-profile
  # time exceeds 25 minutes — deterministically, every day, since the query
  # order doesn't change run to run. Filters on sp_refresh_token_encrypted
  # (unlike ads-profiles) because these 6 jobs are SP-API-only; a profile
  # with no SP token would just no-op and waste a runner.
  sp-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      profiles: ${{ steps.list.outputs.profiles }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      # --omit=dev: none of these jobs run `next build`/lint/test (that's
      # Vercel's job + tests.yml) - they only bundle+run scripts/sync.ts via
      # esbuild, so the Next.js/Tailwind/ESLint/Jest/TypeScript devDependency
      # tree (the bulk of node_modules) is dead weight here. Combined with
      # the cache above, this is a meaningful chunk of the ~1min/job npm
      # install time on every one of these runs - and sync.yml alone fans out
      # into a couple dozen job runs/day across all the matrix profiles.
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: npx esbuild scripts/list-sp-profiles.ts --bundle --platform=node --target=node22 --format=esm --packages=external --outfile=dist/list-sp-profiles.mjs
      - id: list
        run: node dist/list-sp-profiles.mjs
        env:
          SYNC_PROFILE_ID: ${{ github.event.inputs.amazonProfileId || github.event.client_payload.amazonProfileId || '' }}
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  ads:
    needs: ads-profiles
    if: ${{ needs.ads-profiles.outputs.profiles != '[]' && ((github.event.inputs.job || github.event.client_payload.job || 'all') == 'all' || (github.event.inputs.job || github.event.client_payload.job || 'all') == 'ads') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJson(needs.ads-profiles.outputs.profiles) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      # --omit=dev: none of these jobs run `next build`/lint/test (that's
      # Vercel's job + tests.yml) - they only bundle+run scripts/sync.ts via
      # esbuild, so the Next.js/Tailwind/ESLint/Jest/TypeScript devDependency
      # tree (the bulk of node_modules) is dead weight here. Combined with
      # the cache above, this is a meaningful chunk of the ~1min/job npm
      # install time on every one of these runs - and sync.yml alone fans out
      # into a couple dozen job runs/day across all the matrix profiles.
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: npx esbuild scripts/sync.ts --bundle --platform=node --target=node22 --format=esm --packages=external --outfile=dist/sync.mjs
      - run: node dist/sync.mjs
        env:
          SYNC_JOB: ads
          SYNC_PROFILE_ID: ${{ matrix.profile }}
          SYNC_REASON: ${{ github.event.inputs.reason || github.event.client_payload.reason || 'cron' }}
          SYNC_MAX_MINUTES: "25"
          # Defensive: the "playwright" package (used only by the SERP tracker
          # stream) has a postinstall hook that downloads Chromium/Firefox/
          # WebKit unless this is set — these 6 ad/seller/finance streams
          # never touch a browser, so skip it to keep npm install fast.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          AMAZON_LWA_CLIENT_ID: ${{ secrets.AMAZON_LWA_CLIENT_ID }}
          AMAZON_LWA_CLIENT_SECRET: ${{ secrets.AMAZON_LWA_CLIENT_SECRET }}
          SP_LWA_CLIENT_ID: ${{ secrets.SP_LWA_CLIENT_ID }}
          SP_LWA_CLIENT_SECRET: ${{ secrets.SP_LWA_CLIENT_SECRET }}

  # Search Term ONLY — fetches just the spSearchTerm report instead of the
  # full 10-report "ads" run. Not part of "all" (see the top-of-file comment):
  # only runs when `job` is explicitly "searchterm", same convention as
  # `returnsbackfill`. Reuses the ads-profiles fan-out so each Amazon profile
  # still gets its own runner/time-budget instead of looping in one worker.
  searchterm:
    needs: ads-profiles
    if: ${{ needs.ads-profiles.outputs.profiles != '[]' && (github.event.inputs.job || github.event.client_payload.job || '') == 'searchterm' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJson(needs.ads-profiles.outputs.profiles) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      # --omit=dev: none of these jobs run `next build`/lint/test (that's
      # Vercel's job + tests.yml) - they only bundle+run scripts/sync.ts via
      # esbuild, so the Next.js/Tailwind/ESLint/Jest/TypeScript devDependency
      # tree (the bulk of node_modules) is dead weight here. Combined with
      # the cache above, this is a meaningful chunk of the ~1min/job npm
      # install time on every one of these runs - and sync.yml alone fans out
      # into a couple dozen job runs/day across all the matrix profiles.
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: npx esbuild scripts/sync.ts --bundle --platform=node --target=node22 --format=esm --packages=external --outfile=dist/sync.mjs
      - run: node dist/sync.mjs
        env:
          SYNC_JOB: searchterm
          SYNC_PROFILE_ID: ${{ matrix.profile }}
          SYNC_REASON: ${{ github.event.inputs.reason || github.event.client_payload.reason || 'manual' }}
          SYNC_MAX_MINUTES: "25"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          AMAZON_LWA_CLIENT_ID: ${{ secrets.AMAZON_LWA_CLIENT_ID }}
          AMAZON_LWA_CLIENT_SECRET: ${{ secrets.AMAZON_LWA_CLIENT_SECRET }}
          SP_LWA_CLIENT_ID: ${{ secrets.SP_LWA_CLIENT_ID }}
          SP_LWA_CLIENT_SECRET: ${{ secrets.SP_LWA_CLIENT_SECRET }}

  finances:
    needs: sp-profiles
    if: ${{ needs.sp-profiles.outputs.profiles != '[]' && ((github.event.inputs.job || github.event.client_payload.job || 'all') == 'all' || (github.event.inputs.job || github.event.client_payload.job || 'all') == 'finances') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJson(needs.sp-profiles.outputs.profiles) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      # --omit=dev: none of these jobs run `next build`/lint/test (that's
      # Vercel's job + tests.yml) - they only bundle+run scripts/sync.ts via
      # esbuild, so the Next.js/Tailwind/ESLint/Jest/TypeScript devDependency
      # tree (the bulk of node_modules) is dead weight here. Combined with
      # the cache above, this is a meaningful chunk of the ~1min/job npm
      # install time on every one of these runs - and sync.yml alone fans out
      # into a couple dozen job runs/day across all the matrix profiles.
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: npx esbuild scripts/sync.ts --bundle --platform=node --target=node22 --format=esm --packages=external --outfile=dist/sync.mjs
      - run: node dist/sync.mjs
        env:
          SYNC_JOB: finances
          SYNC_PROFILE_ID: ${{ matrix.profile }}
          SYNC_REASON: ${{ github.event.inputs.reason || github.event.client_payload.reason || 'cron' }}
          SYNC_MAX_MINUTES: "25"
          # Defensive: the "playwright" package (used only by the SERP tracker
          # stream) has a postinstall hook that downloads Chromium/Firefox/
          # WebKit unless this is set — these 6 ad/seller/finance streams
          # never touch a browser, so skip it to keep npm install fast.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          AMAZON_LWA_CLIENT_ID: ${{ secrets.AMAZON_LWA_CLIENT_ID }}
          AMAZON_LWA_CLIENT_SECRET: ${{ secrets.AMAZON_LWA_CLIENT_SECRET }}
