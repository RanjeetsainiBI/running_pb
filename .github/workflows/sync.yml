  # root-cause (GitHub Actions silently drops a job output whenever its text
  # coincidentally contains an exact substring of a secret referenced in that
  # job — "Skip output 'profiles' since it may contain secret" — which broke
  # the entire fan-out matrix on the public-repo runner on 2026-09-23/24).
