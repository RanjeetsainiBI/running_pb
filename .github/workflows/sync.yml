name: Sync Amazon data (public-repo runner)

# ============================================================================
# THIS FILE DOES NOT GO IN THE bi-adlytics REPO. It belongs in a brand-new,
# SEPARATE public repo you create (any name — e.g. "bi-adlytics-ci"), at
# path .github/workflows/sync.yml in THAT repo.
#
# WHY THIS EXISTS: bi-adlytics (the private repo with your actual app code)
# was burning through its monthly GitHub Actions minutes allotment — this
# workflow alone fanned out into ~18 job runs every night. Public repos get
# UNLIMITED free GitHub-hosted Actions minutes, so this is the exact same
# workflow, just living in a public repo and checking out the PRIVATE repo's
# code at runtime instead of its own. No application source code, and no
# business data, lives in the public repo itself — see the checkout step
# below and scripts/sync.ts's redacted-by-default logging
# leave the private repo. What IS visible to anyone who opens the public
# repo: this YAML file itself (job names, schedule, env var NAMES — never
# values) and this repo's own Actions run logs (which only ever print
# redacted ok/error lines by default, see scripts/sync.ts).
#
# bi-adlytics's OWN copy of this workflow (.github/workflows/sync.yml) is
# left intact but DORMANT (its `schedule:` trigger is commented out) —
# switching back to running it there is a one-line uncomment, no rebuild
# needed. See that file's top comment for the switch-back instructions.
#
# ---------------------------------------------------------------------------
# ONE-TIME SETUP before this can run:
#
# 1. Create this repo on github.com/new — Public, empty (no README needed,
#    though a short one describing it as "CI runner for a private project"
#    is good practice). Upload this file to .github/workflows/sync.yml here.
#
# 2. Create a fine-grained Personal Access Token scoped to ONLY the
#    bi-adlytics repo, Repository permissions -> Contents: Read-only.
#    (github.com -> Settings -> Developer settings -> Personal access tokens
#    -> Fine-grained tokens -> Generate new token -> Repository access:
#    "Only select repositories" -> bi-adlytics -> Contents: Read-only.)
#    Set an expiration and put a reminder to renew it before it lapses —
#    when it expires, every run here starts failing at the checkout step.
#
# 3. In THIS public repo's own Settings -> Secrets and variables -> Actions,
#    add:
#      PRIVATE_REPO_PAT              <- the token from step 2
#      NEXT_PUBLIC_SUPABASE_URL      <- same value as in bi-adlytics
#      SUPABASE_SERVICE_ROLE_KEY     <- same value as in bi-adlytics
#      TOKEN_ENCRYPTION_KEY          <- same value as in bi-adlytics
#      AMAZON_LWA_CLIENT_ID          <- same value as in bi-adlytics
#      AMAZON_LWA_CLIENT_SECRET      <- same value as in bi-adlytics
#      SP_LWA_CLIENT_ID              <- same value as in bi-adlytics
#      SP_LWA_CLIENT_SECRET          <- same value as in bi-adlytics
#    (These are the exact same secret NAMES bi-adlytics already has — just
#    re-enter the same values here. GitHub secrets never sync across repos,
#    each repo keeps its own copy, and each is encrypted/masked the same way
#    regardless of the repo's visibility.)
#
# 4. Also generate a package-lock.json situation the same way bi-adlytics
#    did if `npm ci` complains — unlikely since this checks out bi-adlytics'
#    own lockfile via the checkout step below, just flagging it as the one
#    thing that could differ from a fresh repo.
# ============================================================================

on:
  schedule:
    # 08:00 IST daily = 02:30 UTC (IST is UTC+5:30) — this is now the LIVE
    # schedule; bi-adlytics's own copy has this commented out.
    - cron: "30 2 * * *"
    # 14:00 IST (2:00 PM) = 08:30 UTC — added 2026-09-19, second run of "all"
    # each day alongside the 08:00 IST run above.
    - cron: "30 8 * * *"
    # 08:30 IST (8:30 AM) = 03:00 UTC, 1st of every month — drives ONLY the
    # referralcommissions job below (matched via github.event.schedule, not
    # "all"), since commissions are a once-a-month calculation, not a daily
    # sync. Added 2026-09-19.
    - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      job:
        description: "all | ads | searchterm | seller | finances | lightbundle | storagefee | reviews | salestraffic | ranktracker | brandanalytics | priceautomation | catalog | inventoryledger | returnsbackfill | fbareturnsbackfill | referralcommissions (inventoryledger normally runs from its own inventory-ledger.yml)"
        required: false
        default: "all"
      amazonProfileId:
        description: "Restrict to one profile id (optional)"
        required: false
        default: ""
      reason:
        description: "manual | cron | initial"
        required: false
        default: "manual"
      backfillStart:
        description: "returnsbackfill/fbareturnsbackfill only — start date YYYY-MM-DD (inclusive)"
        required: false
        default: ""
      backfillEnd:
        description: "returnsbackfill/fbareturnsbackfill only — end date YYYY-MM-DD (exclusive)"
        required: false
        default: ""
  repository_dispatch:
    types: [sync]

concurrency:
  group: amazon-sync-${{ github.run_id }}
  cancel-in-progress: false

# GENERATED from bi-adlytics/.github/workflows/sync.yml (the job logic's
# source of truth) by bi-adlytics/scripts/gen-public-sync.mjs, which adds
# the private-repo checkout (repository / ref / token) to every job and
# forwards SYNC_VERBOSE_LOGS. Edit jobs THERE, then regenerate this file;
# only the header, the `on:` schedule and the referralcommissions job are
# specific to this repo. Last regenerated 2026-11-17.
jobs:
  seller:
    needs: sp-profiles
    if: ${{ needs.sp-profiles.outputs.profiles != '[]' && ((github.event.inputs.job || github.event.client_payload.job || 'all') == 'all' || (github.event.inputs.job || github.event.client_payload.job || 'all') == 'seller') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJson(needs.sp-profiles.outputs.profiles) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: RanjeetsainiBI/bi-adlytics
          ref: main
          token: ${{ secrets.PRIVATE_REPO_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      # --omit=dev: none of these jobs run `next build`/lint/test (that's
      # Vercel's job + tests.yml) - they only bundle+run scripts/sync.ts via
      # esbuild, so the Next.js/Tailwind/ESLint/Jest/TypeScript devDependency
      # tree (the bulk of node_modules) is dead weight here. Combined with
      # the cache above, this is a meaningful chunk of the ~1min/job npm
      # install time on every one of these runs - and sync.yml alone fans out
      # into a couple dozen job runs/day across all the matrix profiles.
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: npx esbuild scripts/sync.ts --bundle --platform=node --target=node22 --format=esm --packages=external --outfile=dist/sync.mjs
      - run: node dist/sync.mjs
        env:
          SYNC_JOB: seller
          SYNC_VERBOSE_LOGS: ${{ secrets.SYNC_VERBOSE_LOGS }}
          SYNC_PROFILE_ID: ${{ matrix.profile }}
          SYNC_REASON: ${{ github.event.inputs.reason || github.event.client_payload.reason || 'cron' }}
          SYNC_MAX_MINUTES: "25"
          # Defensive: the "playwright" package (used only by the SERP tracker
          # stream) has a postinstall hook that downloads Chromium/Firefox/
          # WebKit unless this is set — these 6 ad/seller/finance streams
          # never touch a browser, so skip it to keep npm install fast.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          AMAZON_LWA_CLIENT_ID: ${{ secrets.AMAZON_LWA_CLIENT_ID }}
          AMAZON_LWA_CLIENT_SECRET: ${{ secrets.AMAZON_LWA_CLIENT_SECRET }}
          SP_LWA_CLIENT_ID: ${{ secrets.SP_LWA_CLIENT_ID }}
          SP_LWA_CLIENT_SECRET: ${{ secrets.SP_LWA_CLIENT_SECRET }}

  # Evaluates enabled price_automation_rules against current inventory and
  # stages price_automation_suggestions rows (never pushes to Amazon itself
  # — see runPriceAutomationEvaluate in lib/sync/core.ts).
  # No longer part of "all" (2026-09-24, see the SCALING comment at the top
  # of this file) — folded into the `lightbundle` job below so it doesn't
  # cost its own 50-profile matrix every night. Kept here, unchanged
  # otherwise, purely for standalone `job=priceautomation` manual runs.
  priceautomation:
    needs: sp-profiles
    if: ${{ needs.sp-profiles.outputs.profiles != '[]' && (github.event.inputs.job || github.event.client_payload.job || 'all') == 'priceautomation' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJson(needs.sp-profiles.outputs.profiles) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: RanjeetsainiBI/bi-adlytics
          ref: main
          token: ${{ secrets.PRIVATE_REPO_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      # --omit=dev: none of these jobs run `next build`/lint/test (that's
      # Vercel's job + tests.yml) - they only bundle+run scripts/sync.ts via
      # esbuild, so the Next.js/Tailwind/ESLint/Jest/TypeScript devDependency
      # tree (the bulk of node_modules) is dead weight here. Combined with
      # the cache above, this is a meaningful chunk of the ~1min/job npm
      # install time on every one of these runs - and sync.yml alone fans out
      # into a couple dozen job runs/day across all the matrix profiles.
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: npx esbuild scripts/sync.ts --bundle --platform=node --target=node22 --format=esm --packages=external --outfile=dist/sync.mjs
      - run: node dist/sync.mjs
        env:
          SYNC_JOB: priceautomation
          SYNC_VERBOSE_LOGS: ${{ secrets.SYNC_VERBOSE_LOGS }}
          SYNC_PROFILE_ID: ${{ matrix.profile }}
          SYNC_REASON: ${{ github.event.inputs.reason || github.event.client_payload.reason || 'cron' }}
          SYNC_MAX_MINUTES: "10"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          AMAZON_LWA_CLIENT_ID: ${{ secrets.AMAZON_LWA_CLIENT_ID }}
          AMAZON_LWA_CLIENT_SECRET: ${{ secrets.AMAZON_LWA_CLIENT_SECRET }}
          SP_LWA_CLIENT_ID: ${{ secrets.SP_LWA_CLIENT_ID }}
          SP_LWA_CLIENT_SECRET: ${{ secrets.SP_LWA_CLIENT_SECRET }}

  # Decides whether tonight is a "catalog night" — see the SCALING comment
  # at the top of this file. catalog_items (title/images/brand) changes
  # rarely enough that a 1-in-3-day cadence is plenty fresh, and skipping it
  # 2 nights out of 3 removes the single longest-running stream (up to 100
  # min/profile for a big catalog) from most nights' job queue entirely.
  # Day-of-year mod 3 gives a stable, deterministic rotation with no stored
  # state needed. A direct `job=catalog` dispatch always bypasses this (see
  # the `if:` on the `catalog` job below) so on-demand/manual runs are never
  # blocked by the gate.
  catalog-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - id: check
        run: |
          doy=$(date -u +%j)
          if [ $((10#$doy % 3)) -eq 0 ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  # Refreshes catalog_items (title, images, bullets, and — critically — the
  # current Amazon Brand) per ASIN via the SP-API Catalog Items endpoint.
  # This is the SOLE source of Brand shown in Product Performance / Brand
  # Performance (see buildBrandLookup in
  # lib/analytics/performance-benchmark-query.ts, 2026-09-04 — the Category
  # CSV's Brand column stopped being read that day). Added 2026-09-18: this
  # job never existed before, so catalog_items was always empty for every
  # account and every SKU rolled up into "Unbranded" from day one — not a
  # bug in the lookup logic, just a job that was written (runProfileCatalogSync
  # in lib/sync/core.ts) but never wired into the schedule until now.
  #
  # `needs: [seller, finances, ads]` + `if: always()` (added 2026-09-24, see
  # the SCALING comment) — waits for the metrics-critical trio to finish so
  # they get first claim on the 20-concurrent-job budget; `always()` means a
  # standalone `job=catalog` dispatch (where seller/finances/ads never ran,
  # so `needs` resolve as "skipped") is never blocked by them.
  catalog:
    needs: [sp-profiles, catalog-gate, seller, finances, ads]
    if: >-
      always() &&
      needs.sp-profiles.outputs.profiles != '[]' &&
      (
        (github.event.inputs.job || github.event.client_payload.job || 'all') == 'catalog' ||
        ((github.event.inputs.job || github.event.client_payload.job || 'all') == 'all' && needs.catalog-gate.outputs.should_run == 'true')
      )
    runs-on: ubuntu-latest
    # Bumped from 35 (2026-09-24, ahead of public-app launch): the Catalog
    # Items API's own ~2 req/s rate limit is the real ceiling here, not the
    # runner — a large catalog (thousands of ASINs, expected once this
    # launches for outside sellers with bigger inventories than today's
    # handful of accounts) needs real headroom to converge, and public-repo
    # Actions minutes are free (see this workflow's top comment), so there's
    # no cost reason to keep this tight. SYNC_MAX_MINUTES below is bumped to
    # match, with room for setup overhead before the job's own timeout hits.
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJson(needs.sp-profiles.outputs.profiles) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: RanjeetsainiBI/bi-adlytics
          ref: main
          token: ${{ secrets.PRIVATE_REPO_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: npx esbuild scripts/sync.ts --bundle --platform=node --target=node22 --format=esm --packages=external --outfile=dist/sync.mjs
      - run: node dist/sync.mjs
        env:
          SYNC_JOB: catalog
          SYNC_VERBOSE_LOGS: ${{ secrets.SYNC_VERBOSE_LOGS }}
          SYNC_PROFILE_ID: ${{ matrix.profile }}
          SYNC_REASON: ${{ github.event.inputs.reason || github.event.client_payload.reason || 'cron' }}
          SYNC_MAX_MINUTES: "90"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          AMAZON_LWA_CLIENT_ID: ${{ secrets.AMAZON_LWA_CLIENT_ID }}
          AMAZON_LWA_CLIENT_SECRET: ${{ secrets.AMAZON_LWA_CLIENT_SECRET }}
          SP_LWA_CLIENT_ID: ${{ secrets.SP_LWA_CLIENT_ID }}
          SP_LWA_CLIENT_SECRET: ${{ secrets.SP_LWA_CLIENT_SECRET }}

  # Decides whether today is a "storage fee day" (2026-09-24 request:
  # "no need for storage fee daily run, Amazon posts it monthly"). Amazon
  # only POSTS the GET_FBA_STORAGE_FEE_CHARGES_DATA report once a month, so
  # running this stream nightly was pure waste — 30 wasted runs for every
  # 1 useful one. Gated to the first 3 days of the calendar month, giving a
  # small buffer in case Amazon's own posting is a day or two late, without
  # waiting a full month to retry if a run fails. A direct `job=storagefee`
  # dispatch always bypasses this gate, same convention as `catalog-gate`.
  storagefee-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - id: check
        run: |
          dom=$(date -u +%d)
          if [ $((10#$dom)) -le 3 ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  # FBA Storage Fee (GET_FBA_STORAGE_FEE_CHARGES_DATA, see
  # runProfileStorageFeeSync in lib/sync/core.ts) — monthly per-ASIN storage
  # cost feeding the SKU Economics tab's FBA Storage Fee column. Gated by
  # `storagefee-gate` above when running as part of "all" (2026-09-24); a
  # direct `job=storagefee` dispatch always runs regardless of the gate.
  storagefee:
    needs: [sp-profiles, storagefee-gate]
    if: >-
      needs.sp-profiles.outputs.profiles != '[]' &&
      (
        (github.event.inputs.job || github.event.client_payload.job || 'all') == 'storagefee' ||
        ((github.event.inputs.job || github.event.client_payload.job || 'all') == 'all' && needs.storagefee-gate.outputs.should_run == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJson(needs.sp-profiles.outputs.profiles) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: RanjeetsainiBI/bi-adlytics
          ref: main
          token: ${{ secrets.PRIVATE_REPO_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: npx esbuild scripts/sync.ts --bundle --platform=node --target=node22 --format=esm --packages=external --outfile=dist/sync.mjs
      - run: node dist/sync.mjs
        env:
          SYNC_JOB: storagefee
          SYNC_VERBOSE_LOGS: ${{ secrets.SYNC_VERBOSE_LOGS }}
          SYNC_PROFILE_ID: ${{ matrix.profile }}
          SYNC_REASON: ${{ github.event.inputs.reason || github.event.client_payload.reason || 'cron' }}
          SYNC_MAX_MINUTES: "30"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          AMAZON_LWA_CLIENT_ID: ${{ secrets.AMAZON_LWA_CLIENT_ID }}
          AMAZON_LWA_CLIENT_SECRET: ${{ secrets.AMAZON_LWA_CLIENT_SECRET }}
          SP_LWA_CLIENT_ID: ${{ secrets.SP_LWA_CLIENT_ID }}
          SP_LWA_CLIENT_SECRET: ${{ secrets.SP_LWA_CLIENT_SECRET }}

  # FBA warehouse-level inventory (GET_LEDGER_SUMMARY_VIEW_DATA, see
  # runProfileInventoryLedgerSync in lib/sync/core.ts) — feeds the Inventory
  # Planning tab's new Warehouse Inventory view. Normally runs from its own
  # dedicated once-a-day workflow on the public repo (_public-repo-ci/
  # inventory-ledger.yml), NOT from this "all" bucket — added here
  # (2026-09-24) purely so it can be dispatched and its logs inspected
  # directly from this repo for debugging (fba_inventory_ledger came back
  # empty after being wired up, needed a live diagnostic run to find out
  # why). SYNC_VERBOSE_LOGS=1 so a manual run here always gets full
  # unredacted output, unlike the public-repo runner's default redacted logs.
  inventoryledger:
    needs: sp-profiles
    if: ${{ needs.sp-profiles.outputs.profiles != '[]' && (github.event.inputs.job || github.event.client_payload.job || 'all') == 'inventoryledger' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJson(needs.sp-profiles.outputs.profiles) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: RanjeetsainiBI/bi-adlytics
          ref: main
          token: ${{ secrets.PRIVATE_REPO_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: npx esbuild scripts/sync.ts --bundle --platform=node --target=node22 --format=esm --packages=external --outfile=dist/sync.mjs
      - run: node dist/sync.mjs
        env:
          SYNC_JOB: inventoryledger
          SYNC_PROFILE_ID: ${{ matrix.profile }}
          SYNC_REASON: ${{ github.event.inputs.reason || github.event.client_payload.reason || 'manual' }}
          SYNC_MAX_MINUTES: "25"
          SYNC_VERBOSE_LOGS: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          AMAZON_LWA_CLIENT_ID: ${{ secrets.AMAZON_LWA_CLIENT_ID }}
          AMAZON_LWA_CLIENT_SECRET: ${{ secrets.AMAZON_LWA_CLIENT_SECRET }}
          SP_LWA_CLIENT_ID: ${{ secrets.SP_LWA_CLIENT_ID }}
          SP_LWA_CLIENT_SECRET: ${{ secrets.SP_LWA_CLIENT_SECRET }}

  # One-off historical catch-up for seller_returns (see runReturnsBackfill in
  # lib/sync/core.ts). Deliberately excluded from "all" — only runs when the
  # `job` input is exactly "returnsbackfill", so the daily cron never touches
  # it. Requires backfillStart/backfillEnd inputs.
  returnsbackfill:
    if: ${{ (github.event.inputs.job || github.event.client_payload.job || '') == 'returnsbackfill' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: RanjeetsainiBI/bi-adlytics
          ref: main
          token: ${{ secrets.PRIVATE_REPO_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      # --omit=dev: none of these jobs run `next build`/lint/test (that's
      # Vercel's job + tests.yml) - they only bundle+run scripts/sync.ts via
      # esbuild, so the Next.js/Tailwind/ESLint/Jest/TypeScript devDependency
      # tree (the bulk of node_modules) is dead weight here. Combined with
      # the cache above, this is a meaningful chunk of the ~1min/job npm
      # install time on every one of these runs - and sync.yml alone fans out
      # into a couple dozen job runs/day across all the matrix profiles.
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: npx esbuild scripts/sync.ts --bundle --platform=node --target=node22 --format=esm --packages=external --outfile=dist/sync.mjs
      - run: node dist/sync.mjs
        env:
          SYNC_JOB: returnsbackfill
          SYNC_VERBOSE_LOGS: ${{ secrets.SYNC_VERBOSE_LOGS }}
          SYNC_PROFILE_ID: ${{ github.event.inputs.amazonProfileId || github.event.client_payload.amazonProfileId || '' }}
          SYNC_BACKFILL_START: ${{ github.event.inputs.backfillStart || github.event.client_payload.backfillStart || '' }}
          SYNC_BACKFILL_END: ${{ github.event.inputs.backfillEnd || github.event.client_payload.backfillEnd || '' }}
          SYNC_REASON: ${{ github.event.inputs.reason || github.event.client_payload.reason || 'manual' }}
          SYNC_MAX_MINUTES: "25"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          AMAZON_LWA_CLIENT_ID: ${{ secrets.AMAZON_LWA_CLIENT_ID }}
          AMAZON_LWA_CLIENT_SECRET: ${{ secrets.AMAZON_LWA_CLIENT_SECRET }}
          SP_LWA_CLIENT_ID: ${{ secrets.SP_LWA_CLIENT_ID }}
          SP_LWA_CLIENT_SECRET: ${{ secrets.SP_LWA_CLIENT_SECRET }}

  # One-off historical catch-up for the FBA-only returns report (see
  # runFbaReturnsBackfill in lib/sync/core.ts). Added 2026-09-10: the
  # 2026-07-17 switch to the "holistic" Returns Report turned out to miss
  # real FBA return events that never generate a formal return-request/RMA
  # record (confirmed against a live seller's Seller Central "FBA customer
  # returns" report) — so the FBA-only report needed to come back as a
  # SECOND source, not a replacement. This job closes the historical gap
  # left by that report being un-synced since the cutover; the daily
  # `seller` job's fbaReturnsStep keeps it current from here on. Run this
  # once (job=fbareturnsbackfill) after this workflow deploys. Deliberately
  # excluded from "all", same reasoning as `returnsbackfill` above.
  fbareturnsbackfill:
    if: ${{ (github.event.inputs.job || github.event.client_payload.job || '') == 'fbareturnsbackfill' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: RanjeetsainiBI/bi-adlytics
          ref: main
          token: ${{ secrets.PRIVATE_REPO_PAT }}
      - uses: actions/setup-node@v4
        with:
